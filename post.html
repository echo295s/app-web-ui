<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>データ管理</title>
    <link rel="icon" href="./favicon.ico" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <div class="page-header">
        <h1>データ管理</h1>
      </div>

      <section class="panel" aria-labelledby="post-heading">
        <div class="section-header">
          <h2 id="post-heading">新規登録</h2>
          <button class="submit-button" type="submit" form="post-form">送信</button>
        </div>
        <form id="post-form">
          <div class="preset-buttons" aria-label="入力プリセット">
            <button id="json-preset-button" class="preset-button active" type="button">
              JSON
            </button>
            <button id="article-preset-button" class="preset-button" type="button">
              記事
            </button>
          </div>
          <div class="field-group">
            <table class="data-fields-table">
              <thead>
                <tr>
                  <th>Key</th>
                  <th>Value</th>
                  <th class="data-field-action-heading" aria-label="削除"></th>
                </tr>
              </thead>
              <tbody id="data-fields">
                <tr class="data-field-row">
                  <td>
                    <input name="dataKey" type="text" aria-label="Key" required />
                  </td>
                  <td>
                    <input name="dataValue" type="text" aria-label="Value" required />
                  </td>
                  <td class="data-field-action-cell">
                    <button
                      class="field-row-delete-button"
                      type="button"
                      data-delete-field-row
                      aria-label="行を削除"
                      title="行を削除"
                    >
                      <img src="./assets/trash-can-solid-full.svg" alt="" aria-hidden="true" />
                    </button>
                  </td>
                </tr>
              </tbody>
            </table>
            <button id="add-field-button" type="button">＋</button>
          </div>
        </form>

        <p id="result">未送信です。</p>
      </section>

      <section class="panel" aria-labelledby="list-heading">
        <div class="section-header">
          <h2 id="list-heading">データ一覧</h2>
          <button id="refresh-button" type="button">更新</button>
        </div>

        <form id="search-form" class="tools">
          <label>
            検索
            <input
              id="search-input"
              name="search"
              type="search"
              placeholder="キーワード検索"
            />
          </label>

          <label>
            検索対象
            <select id="search-target" name="searchTarget">
              <option value="all">すべて</option>
              <option value="rawData">Data</option>
              <option value="id">ID</option>
              <option value="timestamp">Timestamp</option>
            </select>
          </label>
        </form>

        <p id="list-result">未取得です。</p>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Data</th>
                <th>Created</th>
              </tr>
            </thead>
            <tbody id="records-body">
              <tr>
                <td colspan="3">データがありません。</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>

      <div class="logout-area">
        <button id="logout-button" type="button">ログアウト</button>
      </div>
    </main>

    <script type="module" src="./js/script.js"></script>
  </body>
</html>
